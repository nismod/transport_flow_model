[project]
name = "nismod-tfm"
dynamic = ["version"]
description = "NISMOD transport flow model"
readme = "README.md"
authors = [
    { name = "Raghav Pant", email = "raghav.pant@ouce.ox.ac.uk" },
    { name = "Tom Russell", email = "tom.russell@ouce.ox.ac.uk" },
]
requires-python = ">=3.10"
dependencies = ["igraph", "geopandas", "pandas", "pyarrow", "pydantic>=2", "tqdm"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "osmnx>=2.0.0,<3",
    "py-spy>=0.4.2,<0.5",
    "maturin>=1.9,<2",
    "pyinstrument>=5.1.2,<6",
    "matplotlib>=3.8"
]
doc = ["sphinx", "pydata-sphinx-theme"]

[build-system]
# maturin builds the Rust extension (transport_flow_model._core) and packages
# the Python sources under src/. The package version comes from Cargo.toml.
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "transport_flow_model._core"
python-source = "src"
manifest-path = "Cargo.toml"
# The sdist holds what is needed to build: Cargo.toml, Cargo.lock, core/
# (Rust sources), src/ (Python sources and package data), pyproject.toml,
# README.md, LICENSE and CHANGELOG.md. Everything else that cargo would
# package from the repository root (examples, scripts, tests, docs, CI and
# local build or benchmark output) is left out.
exclude = [
    { path = ".github/**/*", format = "sdist" },
    { path = ".gitattributes", format = "sdist" },
    { path = ".gitignore", format = "sdist" },
    { path = "benchmark_data/**/*", format = "sdist" },
    { path = "benchmark_results/**/*", format = "sdist" },
    { path = "config.*.json", format = "sdist" },
    { path = "DEVELOPMENT.md", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
    { path = "example/**/*", format = "sdist" },
    { path = "pixi.lock", format = "sdist" },
    { path = "profile_results/**/*", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = "target/**/*", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
transport-flow-model = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.environments]
default = ["dev", "doc"]

[tool.pixi.feature.dev.tasks]
bench = "python scripts/benchmark_assignment.py"
benchmark-scripts = "python scripts/benchmark_flow_scripts.py"
benchmark-scripts-smoke = "python scripts/benchmark_flow_scripts.py --config config.example.json --repeats 1 --max-seconds 30"
prepare-benchmark-data = "python scripts/benchmark_preparation.py"
profile-flow-allocation = "python scripts/profile_flow_scripts.py --script allocation"
profile-flow-disruptions = "python scripts/profile_flow_scripts.py --script disruptions"
profile-flow-scripts = "python scripts/profile_flow_scripts.py"
extension-build = "maturin develop --manifest-path Cargo.toml"
extension-test = "cargo test"
extension-bench = "cargo bench"
lint = "ruff check"
format = "ruff format"
test = "python -m pytest tests"

[tool.pixi.feature.doc.tasks]
docs = "cd docs && make html"
doctest = "cd docs && make doctest"
