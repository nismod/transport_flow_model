[project]
name = "transport-flow-model"
dynamic = ["version"]
description = "Transport flow model"
readme = "README.md"
authors = [
    { name = "Raghav Pant", email = "raghav.pant@ouce.ox.ac.uk" },
    { name = "Tom Russell", email = "tom.russell@ouce.ox.ac.uk" },
]
requires-python = ">=3.10"
dependencies = ["igraph", "geopandas", "pandas", "pyarrow", "tqdm"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.15.14,<0.16",
    "osmnx>=2.0.0,<3",
    "py-spy>=0.4.2,<0.5",
    "maturin>=1.9,<2"
, "pyinstrument>=5.1.2,<6"]
doc = ["sphinx", "pydata-sphinx-theme"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/transport_flow_model/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.maturin]
module-name = "transport_flow_model._core"
python-source = "src"
manifest-path = "Cargo.toml"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
transport-flow-model = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.environments]
default = ["dev", "doc"]

[tool.pixi.feature.dev.tasks]
benchmark-scripts = "python scripts/benchmark_flow_scripts.py"
benchmark-scripts-smoke = "python scripts/benchmark_flow_scripts.py --config config.example.json --repeats 1 --max-seconds 30"
prepare-benchmark-data = "python scripts/benchmark_preparation.py"
profile-flow-allocation = "python scripts/profile_flow_scripts.py --script allocation"
profile-flow-disruptions = "python scripts/profile_flow_scripts.py --script disruptions"
profile-flow-scripts = "python scripts/profile_flow_scripts.py"
extension-build = "maturin develop --manifest-path Cargo.toml"
extension-test = "cargo test"
extension-bench = "cargo bench"
lint = "ruff check"
format = "ruff format"
test = "python -m pytest tests"

[tool.pixi.feature.doc.tasks]
docs = "cd docs && make html"
doctest = "cd docs && make doctest"
