[project]
name = "transport-flow-model"
dynamic = ["version"]
description = "Transport flow model"
readme = "README.md"
authors = [
    { name = "Raghav Pant", email = "raghav.pant@ouce.ox.ac.uk" },
    { name = "Tom Russell", email = "tom.russell@ouce.ox.ac.uk" },
]
requires-python = ">=3.12"
dependencies = ["igraph", "geopandas", "pandas", "pyarrow", "tqdm"]

[dependency-groups]
dev = ["black", "mypy", "pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/transport_flow_model/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
transport-flow-model = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -m pytest tests"

[tool.pixi.environments]
default = ["dev"]
