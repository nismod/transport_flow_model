[package]
name = "transport-flow-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[lib]
name = "_core"
path = "core/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { version = "59.0.0", default-features = false, features = ["ffi", "ipc"] }
pyo3 = { version = "0.29.0", features = ["abi3-py310", "extension-module"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
path = "core/benches/core.rs"
harness = false
